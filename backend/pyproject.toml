[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-global-compensation-intelligence-backend"
version = "0.1.0"
description = "Backend API for AI Global Compensation Intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "httpx>=0.27",
    "anthropic>=0.122",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "python-dotenv>=1.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated migration files churn constantly and don't need to satisfy
# hand-written style rules; env.py itself is hand-maintained and stays linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection relies on calling Depends()/Query()/Path()
# in argument defaults by design — not the mutable-default-argument bug B008
# otherwise correctly guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
