name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      LOG_LEVEL: WARNING
      BACKEND_CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://compintel_ci:compintel_ci@localhost:5432/compintel_ci
      # Deliberately an obvious, self-describing dummy rather than a
      # random-looking string. It signs access tokens only for the
      # duration of one CI run against a throwaway database that is
      # destroyed with the runner, so it protects nothing - but a
      # high-entropy value sitting in a public repo trips secret scanners
      # and makes a reader stop to work out whether it matters. Saying so
      # in the value itself is cheaper than making anyone check.
      # Real secrets live in git-ignored .env files and are never
      # committed (verified across the full history before publishing).
      JWT_SECRET_KEY: ci-only-dummy-not-a-real-secret-throwaway-database
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend package
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app tests

      # No services: postgres container — this installs/starts PostgreSQL
      # directly on the runner, matching the "no Docker anywhere" constraint
      # even in CI, not just in local dev and production.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service || sudo apt-get install -y postgresql
          for i in $(seq 1 10); do
            pg_isready -h localhost -p 5432 && break
            sleep 1
          done

      - name: Create CI database role and database
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE compintel_ci WITH LOGIN PASSWORD 'compintel_ci';
          CREATE DATABASE compintel_ci OWNER compintel_ci;
          SQL

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format

      - name: Test (vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high
